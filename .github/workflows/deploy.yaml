name: Docker CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t portfolio-website .

      - name: Push Docker image
        run: |
          docker tag portfolio-website ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest

      - name: Trigger Render deploy
        run: curl -X POST https://api.render.com/deploy/srv-d5981t6uk2gs73e1tvk0?key=FCxoYfn_eZg
